<!DOCTYPE html>
<html lang="en">
<head>
  <title>Felicia Bakes</title>
  <meta charset="UTF-8">
  <meta name="author" content="Ntombi Moekwa">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="An Online Bakery Store that sells bento Cakes and cupcakes made from scratch at home with love, this website can be used to place orders "
  >

  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/medium.css">
  <link rel="stylesheet" href="styles/mobile.css">
  <link rel="stylesheet" href="styles/larger.css">

  <link rel="icon" href="/images/logo-transparent.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">

  <meta property="og:title" content="Felicia Bakes Online Store ">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://vinoliamoekwa.github.io/Felicia-Bakes/images/bento_diy_box.webp">
  <meta property="og:url" content="https://vinoliamoekwa.github.io/feliciabakes/contact.html">
</head>

<body>
  <header class="header">
  <div class="header-top">
    <div class="logo">
      <img src="images/logo-transparent.png" alt="Felicia Bakes Logo">
    </div>

    <nav class="navigation" id="mobileNav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="order.html" class="nav-link">Order</a>
      <a href="tracking.html" class="nav-link">Track Order</a>
      <a href="contact.html" class="nav-link">Contact Us</a>
    </nav>

    <div class="social-icons">
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-tiktok"></i></a>
      <a href="#"><i class="fab fa-whatsapp"></i></a>
    </div>
  </div>

  <div class="hamburger" id="hamburger" aria-label="Open menu">
    <span></span>
    <span></span>
    <span></span>
  </div>
</header>

  <main class="form-page">
    <section class="form-intro contact-intro">
      <h2>Contact Us</h2>
    </section>

    <section class="form-section disclaimer-card">
      <p>
        Please note: This is just a quote. The final price may vary depending on
        ingredients and design.
      </p>
    </section>

    <section class="form-section contact-summary">
      <h3>Review Your Order</h3>
      <p class="contact-summary-text">
        Please review your order before sending it via WhatsApp.
      </p>

      <div class="summary-list">
        <p><strong>Name:</strong> <span id="full-name"></span></p>
        <p><strong>Email:</strong> <span id="email"></span></p>
        <p><strong>Order:</strong> <span id="orderDetails"></span></p>
      </div>

      <button id="sendWhatsapp" class="submit-btn" type="button">
        Message Us on WhatsApp
      </button>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__logo">
      <img src="images/logo-transparent.png" alt="Felicia Bakes Logo">
    </div>

    <div class="footer-icons">
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-tiktok"></i></a>
      <a href="#"><i class="fab fa-whatsapp"></i></a>
      <a href="#"><i class="fas fa-map-marker-alt"></i></a>
    </div>

    <p>&copy; 2024 Felicia Bakes. All rights reserved.</p>
  </footer>

  <script src="scripts/contact.js"></script>
  <script src="scripts/index.js"></script>
