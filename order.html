    <main>

        <div class="order-h2">
    <h2 > Get your Quote</h2>
    <p>Fill in your name, your order details, and hit send — we’ll take care of the rest!</p>
    </div>
    <form id="order-form">
        <h3>Customer Information</h3>
        <label for="full-name"> Full Name:</label>
        <input type="text" id="full-name" name="full-name" required>

        <label for="contact-number"> Contact Number:</label>
        <input type="tel" id="contact-number" name="contact-number" required>

        <label for="email"> Email:</label>
        <input type="email" id="email" name="email" required>

        <h3>Order Details</h3>
    <label>Type of Baked Good (You can select both):</label><br>
    <input type="checkbox" id="cake-checkbox" name="product-type" value="cake"> Cake
    <input type="checkbox" id="cupcake-checkbox" name="product-type" value="cupcake"> Cupcakes

      
        <label for="flavour">Flavor Selection:</label>
        <select id ="flavour" name="flavour">
            <option value="selectoption"> Select Flavour</option>
            <option value="chocolate">Chocolate</option>
            <option value="vanilla">Vanilla</option>
            <option value="red velvet">Red velvet</option>
            <option value="carrot">Carrot</option>
            <option value="strawberry">strawberry</option>
            <option value="banana">Banana</option>
            <option value="coffee">Coffee</option>
            <option value="marble">Marble</option>
            <option value="cheese">Cheese</option>
        </select>
      
        <label for="filling">Filling Selection:</label>
        <select id="filling" name="filling">
            <option value="selectoption">Select Filling</option>
            <option value="Buttercream">Buttercream</option>
            <option value="Whipped Cream">Whipped Cream</option>
            <option value="Fruit Jam"> Fruit Jam</option>
            <option value="Cream Cheese">Cream Cheese</option>
            <option value="Chocolate Ginache">Chocolate Ginache</option>
        </select>
      
    

<label for="design-type">Design Type:</label>
<select id="design-type" name="design-type">
    <option value="selectoption"> Select Design Type</option>
  <option value="fondant">Fondant</option>
  <option value="buttercream">Buttercream</option>
  <option value="icing">Icing</option>
</select>

<label for="cake-size">Cake Size:</label>
<select id="cake-size" name="cake-size">
    <option value="selectoption">Select Size</option>
  <option value="small">Small</option>
  <option value="medium">Medium</option>
  <option value="large">Large</option>
</select>

<label for="cupcake-topping">Cupcake Topping:</label>
<select id="cupcake-topping" name="cupcake-topping">
    <option value="">Select Topping</option>
    <option value="simpleSwirl">Simple Swirl</option>
    <option value="bespoke">Bespoke</option>
    <option value="ediblePrint">Edible Print</option>
    <option value="acrylicTopper">Acrylic Topper</option>
    <option value="fondant">Fondant</option>
</select>

<label for="cupcake-quantity">Number of Cupcakes:</label>
<input type="number" id="cupcake-quantity" min="1" value="1">


        <label for="design">Design Description:</label>
        <textarea id="design" name="design" required></textarea>
      

        <h3>Customization Options</h3>
        <label for="color-scheme">Color Scheme:</label>
        <input type="text" id="color-scheme" name="color-scheme">
      
        <label for="message">Personalized Message:</label>
        <input type="text" id="message" name="message">
      
        <label for="dietary">Dietary Restrictions:</label>
        <textarea id="dietary" name="dietary"></textarea>
      
        <h3>Event Details</h3>
        <label for="occasion">Occasion Type:</label>
        <select id="occasion" name="occasion">
          <option value="birthday">Birthday</option>
          <option value="wedding">Wedding</option>
          <option value="anniversary">Anniversary</option>
        </select>
      
        <label for="event-date">Event Date and Time:</label>
        <input type="datetime-local" id="event-date" name="event-date" required>

      
        <h3>Terms and Conditions</h3>
        <label for="payment">Payment Details:</label>
        <input type="text" id="payment" name="payment" value="EFTs only" disabled>
      
        <label for="cancellation">Cancellation Policy:</label>
        <textarea id="cancellation" name="cancellation" disabled>Cancellations to be made within 24 hours of placing an order</textarea>
      
        <label for="terms">
          <input type="checkbox" id="terms" name="terms" required>
          I agree to the terms and conditions
        </label>

        
<h3>Total Price: R<span id="total-price">0.00</span></h3>

      
        <button id="submitOrder" type="submit">Submit Order</button>

    
      </form>
